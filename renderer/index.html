<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #14161a; color: #e6e8eb; display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 10px 14px; background: #1b1e24; border-bottom: 1px solid #2a2e36;
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .meta { font-size: 11px; color: #8a92a0; margin-left: auto; }
    select, button, textarea { font: inherit; }
    #view { padding: 10px; border-bottom: 1px solid #2a2e36; background: #0e1013; text-align: center; }
    #view img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid #2a2e36; }
    #view .placeholder { color: #5a616c; padding: 24px; font-size: 12px; }
    #log { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #223047; }
    .msg.assistant { background: #1e2530; }
    .msg.final { background: #1f3326; border: 1px solid #2f5c3f; }
    .msg.error { background: #3a1e1e; border: 1px solid #5c2f2f; color: #ffb4b4; }
    .step { font-size: 11px; color: #9aa3b1; margin: 3px 0; font-family: ui-monospace, monospace; }
    .step b { color: #7fd1ff; }
    .result { font-size: 11px; color: #6f7684; margin: 1px 0 6px 12px; font-family: ui-monospace, monospace; }
    footer { padding: 10px; background: #1b1e24; border-top: 1px solid #2a2e36; }
    .settings { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .settings label { font-size: 11px; color: #8a92a0; }
    .settings input {
      flex: 1; background: #0e1013; color: #e6e8eb; border: 1px solid #2a2e36;
      border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: ui-monospace, monospace;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; height: 54px; background: #0e1013; color: #e6e8eb;
      border: 1px solid #2a2e36; border-radius: 8px; padding: 8px;
    }
    .controls { display: flex; flex-direction: column; gap: 6px; }
    button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid #2a2e36; cursor: pointer;
      background: #2b6cff; color: #fff; font-weight: 600;
    }
    button.stop { background: #3a2020; color: #ff9b9b; border-color: #5c2f2f; }
    button:disabled { opacity: .5; cursor: default; }
    select { background: #0e1013; color: #e6e8eb; border: 1px solid #2a2e36; border-radius: 6px; padding: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>Computer-Use Chat</h1>
    <select id="target">
      <option value="desktop">🖥️ desktop</option>
      <option value="android">📱 android (adb)</option>
    </select>
    <span class="meta" id="meta"></span>
  </header>
  <div id="view"><div class="placeholder">no screenshot yet</div></div>
  <div id="log"></div>
  <footer>
    <div class="settings">
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" type="text" spellcheck="false" placeholder="http://localhost:20128/v1" />
    </div>
    <div class="row">
      <textarea id="task" placeholder="e.g. Open Spotlight and search for Safari"></textarea>
      <div class="controls">
        <button id="run">Run</button>
        <button id="stop" class="stop" disabled>Stop</button>
      </div>
    </div>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
